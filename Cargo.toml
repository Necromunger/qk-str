[package]
name = "qk-str"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[workspace]
members = [
    "crates/qk-common",
    "crates/eq",
    "crates/contains",
    "crates/starts",
    "crates/ends",
    "crates/empty",
    "crates/isnum",
    "crates/len",
    "crates/trim",
    "crates/upper",
    "crates/lower",
    "crates/replace",
    "crates/rev",
    "crates/slug",
    "crates/between",
    "crates/sub",
    "crates/nth",
    "crates/match",
    "crates/matchall",
    "crates/count",
    "crates/split",
    "crates/chars",
    "crates/lines",
    "crates/uniq",
    "crates/pad",
    "crates/rpad",
    "crates/repeat",
    "crates/hash",
    "crates/b64",
    "crates/hex",
    "crates/join",
    "crates/fetch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Common string utility functions as standalone CLI commands, for humans and AI agents."
repository = "https://github.com/Necromunger/qk-str"

[workspace.dependencies]
qk-common = { path = "crates/qk-common" }
regex = "1"
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
